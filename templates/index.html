<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGA - Sistema de Gestão de Ativos</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light">

    <div id="menuSide" class="sidenav">
        <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
        <div class="user-info">
            <p><strong>Usuário:</strong> {{ user_nome }}</p>
            <p style="font-size: 0.8em; color: #888;">Nível: {{ user_nivel }}</p>
            <p style="font-size: 0.7em; color: #555;">ID: 123456789</p>
        </div>
        <hr>
        <a href="/index">Início</a>
        <a href="/newAsset">Novo Ativo</a>
        <a href="/login" style="color: #ff4d4d; margin-top: 50px;">Deslogar</a>
    </div>

    <span class="hamburger-icon" onclick="openNav()">&#9776;</span>

    <div class="main-container">
        
        <div class="logo-wrapper">
            <div class="logo-circular">
                <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo SGA">
            </div>
        </div>

        <h2 style="text-align: center; color: #333; margin-bottom: 25px; font-weight: bold;">
            SGA - Sistema de Gestão de Ativos
        </h2>

        <div class="card-section">
            <a href="/newAsset" style="text-decoration: none; width: 100%;">
                <button class="btn-primary">Cadastrar novo Equipamento</button>
            </a>
        </div>

        <div class="card-section">
            <button class="btn-primary" onclick="abrirCamera()" style="margin-bottom: 15px;">
                Ler QRCODE
            </button>

            <form action="/consult" method="POST">
                <div class="form-group" style="text-align: left;">
                    <label style="font-weight: bold; color: #555; font-size: 0.9em;">Código do Ativo</label>
                    <input type="text" name="id_busca" inputmode="numeric" maxlength="5" required 
                           style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; margin-top: 5px;">
                </div>
                <button type="submit" class="btn-primary" style="margin-top: 15px;">Pesquisar Código</button>
            </form>
        </div>

        <p class="footer-text" style="margin-top: 20px; opacity: 0.6;">SGA v1.0</p>
    </div>

    <script>
        function abrirCamera() { alert("Acessando a câmera..."); }
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('erro') === 'inexistente') {
            alert("Código inexistente!");
            window.history.replaceState({}, document.title, "/index");
        }
        function openNav() { document.getElementById("menuSide").style.width = "250px"; }
        function closeNav() { document.getElementById("menuSide").style.width = "0"; }
    </script>
</body>
</html>
