{% extends 'base.html' %}

{% block title %}SGA - Login{% endblock %}

{% block content %}
    <div class="card-container mt-15" style="max-width: 400px; margin-left: auto; margin-right: auto;">
        <h2 class="page-title">Acesso ao Sistema</h2>
        
        {% if erro %}
            <p style="color: #dc3545; font-weight: bold; margin-bottom: 15px; font-size: 0.9em;">
                ⚠️ {{ erro }}
            </p>
        {% endif %}

        <form action="/login" method="POST">
            <div class="form-group">
                <label>ID do Usuário</label>
                <input type="text" name="id_usuario" placeholder="Digite seu ID" required>
            </div>

            <div class="form-group mt-15">
                <label>Senha</label>
                <input type="password" name="senha" placeholder="******" required>
            </div>

            <button type="submit" class="btn-primary mt-15">
                Entrar
            </button>
        </form>
    </div>
{% endblock %}

{% block scripts %}
    // Login não precisa de scripts específicos por enquanto
{% endblock %}
