<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGA - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light">

    <div class="main-container">
        <div class="logo-wrapper">
            <div class="logo-circular">
                <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo SGA">
            </div>
        </div>

        <div class="card-container">
            <h2 style="margin-bottom: 20px;">Acesso ao Sistema</h2>
            
            {% if erro %}
                <p style="color: #dc3545; font-weight: bold; margin-bottom: 15px;">{{ erro }}</p>
            {% endif %}

            <form action="/login" method="POST">
                <div class="form-group">
                    <label>ID do Usuário</label>
                    <input type="text" name="id_usuario" placeholder="Digite seu ID" required>
                </div>

                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" name="senha" placeholder="******" required>
                </div>

                <button type="submit" class="btn-primary">Entrar</button>
            </form>
        </div>
        <p class="footer-text">SGA v1.0</p>
    </div>
</body>
</html>
