<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGA - Novo Cadastro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    
    <div class="card-container">
        <div class="form-group">
            <label>Equipamento</label>
            <input type="text" id="equipamento" placeholder="Nome do ativo">
        </div>

        <div class="form-group">
            <label>Data</label>
            <input type="text" id="data_dispositivo" class="readonly-field" readonly>
        </div>

        <div class="form-group">
            <label>Descrição do que foi feito</label>
            <textarea id="descricao" rows="4" placeholder="Relatório técnico..."></textarea>
        </div>

        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">

        <label style="text-align: center; display: block;">Identificação Gerada</label>
        <div class="display-qrcode-area">
            <div style="color: #ccc; font-size: 14px;">O QR Code aparecerá aqui após salvar</div>
            </div>

        <div style="text-align: center; margin-bottom: 20px;">
            <span class="id-display">00000</span>
        </div>

        <button class="btn-primary">Salvar</button>
        
        <button class="btn-primary" style="background-color: #28a745; margin-top: 10px;">
            Imprimir QRCODE com CODIGO
        </button>
    </div>

    <script>
        // Puxar data automática do sistema
        function atualizarData() {
            const agora = new Date();
            const formatada = agora.toLocaleDateString('pt-BR') + ' ' + agora.toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});
            document.getElementById('data_dispositivo').value = formatada;
        }
        atualizarData();
    </script>

</body>
</html>
