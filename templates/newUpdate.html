<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGA - Nova Atualização</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light">

    <div id="menuSide" class="sidenav">
    <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
    <div class="user-info">
        <p><strong>Usuário:</strong> {{ user_nome if user_nome else 'Técnico' }}</p>
        <p style="font-size: 0.8em; color: #888;">Nível: {{ user_nivel if user_nivel else 'N/A' }}</p>
        <p style="font-size: 0.7em; color: #555;">ID: 123456789</p>
    </div>
    <hr>
    <a href="/index">Início</a>
    <a href="/newAsset">Novo Ativo</a>
    <a href="/logout" style="color: #ff4d4d; margin-top: 50px;">Deslogar</a>
</div>

    <span class="hamburger-icon" onclick="openNav()">&#9776;</span>

    <div class="main-container">
        <div class="logo-wrapper">
            <div class="logo-circular">
                <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo SGA">
            </div>
        </div>

       <h2 style="text-align: center; color: #333; margin-bottom: 25px; font-weight: bold;">
            SGA - Sistema de Gestão de Ativos
        </h2>

        <div class="card-container" style="max-width: 450px; width: 100%;">
            <form action="/saveUpdate" method="POST">
                <input type="hidden" name="id_ativo" value="{{ id_ativo }}">

                <div class="form-group">
                    <label style="font-weight: bold;">Equipamento</label>
                    <div class="readonly-field" style="background: #f0f0f0; padding: 10px; border-radius: 5px;">
                        {{ nome }} (ID: {{ id_ativo }})
                    </div>
                </div>

                <div class="form-group" style="margin-top: 15px;">
                    <label style="font-weight: bold;">Data da Atualização</label>
                    <input type="text" id="data_auto" class="readonly-field" readonly 
                           style="width: 100%; padding: 10px; background: #eee; border: 1px solid #ddd; border-radius: 5px;">
                    <input type="hidden" name="data_escondida" id="data_escondida">
                </div>

                <div class="form-group" style="margin-top: 15px;">
                    <label style="font-weight: bold;">Resumo da Manutenção / Alteração</label>
                    <textarea name="resumo_atualizacao" rows="6" placeholder="Descreva o que foi feito no equipamento..." required
                              style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px;"></textarea>
                </div>

                <button type="submit" class="btn-primary" style="margin-top: 20px;">Salvar Atualização</button>
                
                <div style="margin-top: 15px;">
    <a href="/consult/{{ id_ativo }}" class="btn-link">
        <button type="button" class="btn-secondary">
            Cancelar e Voltar
        </button>
    </a>
</div>
            </form>
        </div>
        <p class="footer-text" style="margin-top: 20px; opacity: 0.6;">SGA v1.0</p>
    </div>

    <script>
        function openNav() { document.getElementById("menuSide").style.width = "250px"; }
        function closeNav() { document.getElementById("menuSide").style.width = "0"; }

        function carregarDataAtualizacao() {
            const agora = new Date();
            const formatada = agora.toLocaleDateString('pt-BR') + ' ' + agora.toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});
            document.getElementById('data_auto').value = formatada;
            document.getElementById('data_escondida').value = formatada;
        }
        carregarDataAtualizacao();
    </script>
</body>
</html>
